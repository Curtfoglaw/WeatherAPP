<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='weathersearch.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
    <title>Weather Search</title>
</head>

<body class="{{ city_condition|lower|replace(' ', '-') }}">

    <div class="weather-container">

        <h1 class="page-title">Curtis' Weather App</h1>

        <form action="/WeatherApp" method="POST" class="weather-form">
            <input type="text" name="city" placeholder="Enter a city" required>
            <button type="submit" class="submit-weather-btn">Search</button>
        </form>

        {% if city_name %}
        <div class="weather-output">
            <h2>{{ city_name }}</h2>
            <p>Condition: {{ city_condition }}</p>
            <p>Temperature: {{ city_temp_celsius }}°C</p>
            <p>Feels like: {{ city_temp_feels_like }}°C</p>
        </div>
        {% endif %}

        {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
        {% endif %}

    </div>

</body>
</html>
