<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="stylesheet", href="{{url_for('static', filename='style.css')}}">
    <div class="weatherHeader">
        <h1>--- WELCOME TO MY WEATHER APP ---</h1>
    </div>
</head>
<body>
    <div class="inputBox">  
        <form action="/", method="POST">
            <input type="text", name="city", placeholder="Enter a city" required>
            <button type="submit">View Weather</button>
        </form>
    </div>
    {% if city_name %}
        <h2>Weather information for: {{city_name}}</h2>
        <p>Condition: {{city_condition}}</p>
        <p>Temperature: {{city_temp_celsius}}</p>
        <p>Temperature feels like: {{city_temp_feels_like}}</p>
    {% endif %}

</body>
</html>
